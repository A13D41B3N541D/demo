<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
	
    <!-- Bootstrap JS with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
</head>
<body>
    
        <div class="container mt-5">
            <h2>Recherche avec suggestions</h2>
            <div class="position-relative mb-3 col-xl-8 col-lg-6 col-md-12 col-sm-12">
                <input type="text" id="search-input" class="form-control" placeholder="Recherchez..." autocomplete="off">
                <div id="suggestions" class="suggestions"></div>
            </div>
        </div>
        
   
    
    
    <!-- Bouton pour ouvrir le modal -->
<!-- Modal -->

    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="flightSearchModalLabel">Recherche de vol</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Boutons pour basculer entre "Aller simple" et "Aller-retour" -->
                <div class="d-flex justify-content-around mb-3">
                    <button class="btn btn-outline-primary" id="oneWayBtn">Aller simple</button>
                    <button class="btn btn-outline-primary" id="roundTripBtn">Aller-retour</button>
                </div>

                <!-- Formulaire "Aller simple" -->
                <form id="oneWayForm" style="display: none;">
                    <div class="mb-3 col-xl-3 col-lg-6 col-md-6 col-sm-12">
                        <label for="departure" class="form-label">Départ</label>
                        <input type="text" class="form-control" id="departure" placeholder="Ville de départ">
                    </div>
                    <div class="mb-3">
                        <label for="destination" class="form-label">Destination</label>
                        <input type="text" class="form-control" id="destination" placeholder="Ville de destination">
                    </div>
                    <div class="mb-3">
                        <label for="departureDate" class="form-label">Date de départ</label>
                        <input type="date" class="form-control" id="departureDate">
                    </div>
                    <button type="submit" class="btn btn-primary">Rechercher un vol</button>
                </form>

                <!-- Formulaire "Aller-retour" -->
                <form id="roundTripForm" style="display: none;">
                    <div class="mb-3">
                        <label for="departureRound" class="form-label">Départ</label>
                        <input type="text" class="form-control" id="departureRound" placeholder="Ville de départ">
                    </div>
                    <div class="mb-3">
                        <label for="destinationRound" class="form-label">Destination</label>
                        <input type="text" class="form-control" id="destinationRound" placeholder="Ville de destination">
                    </div>
                    <div class="mb-3">
                        <label for="departureDateRound" class="form-label">Date de départ</label>
                        <input type="date" class="form-control" id="departureDateRound">
                    </div>
                    <div class="mb-3">
                        <label for="returnDate" class="form-label">Date de retour</label>
                        <input type="date" class="form-control" id="returnDate">
                    </div>
                    <button type="submit" class="btn btn-primary">Rechercher un vol aller-retour</button>
                </form>
            </div>
        </div>
    </div>
</div>
	<div class="field-label">Passager</div>
	<div class="field-inner d-flex align-items-center">
		<input type="text" id="passengerInput" class="form-control" name="field-name" value="" placeholder="Guests" readonly required>
		<i class="alt-icon fa fa-user ms-2"></i>
	</div>

	<!-- Fenêtre contextuelle pour sélectionner les passagers -->
	<div id="passengerDropdown" class="dropdown-passengers border p-3 bg-white shadow">
		<div class="passenger-type d-flex justify-content-between align-items-center mb-3">
			<span>Adultes</span>
			<div>
				<button class="btn btn-outline-secondary btn-sm" onclick="decreaseCount('adultCount')">-</button>
				<span id="adultCount" class="mx-2">1</span>
				<button class="btn btn-outline-secondary btn-sm" onclick="increaseCount('adultCount')">+</button>
			</div>
		</div>
		<div class="passenger-type d-flex justify-content-between align-items-center mb-3">
			<span>Enfants (2-12 ans)</span>
			<div>
				<button class="btn btn-outline-secondary btn-sm" onclick="decreaseCount('childCount')">-</button>
				<span id="childCount" class="mx-2">0</span>
				<button class="btn btn-outline-secondary btn-sm" onclick="increaseCount('childCount')">+</button>
			</div>
		</div>
		<div class="passenger-type d-flex justify-content-between align-items-center mb-3">
			<span>Bébés (0-2 ans)</span>
			<div>
				<button class="btn btn-outline-secondary btn-sm" onclick="decreaseCount('babyCount')">-</button>
				<span id="babyCount" class="mx-2">0</span>
				<button class="btn btn-outline-secondary btn-sm" onclick="increaseCount('babyCount')">+</button>
			</div>
		</div>
		<button id="applyPassengers" class="btn btn-primary w-100">Appliquer</button>
	</div>

<script src="js.js">
  
</script>

</body>
</html>
